<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JunkSnap</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f6f0; --ink: #16211a; --muted: #5d6b62; --line: #d9dccf;
    --wet: #2f8f4e; --dry: #2b6cb0; --recyclable: #d99a00; --hazardous: #c53030;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 960px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { font-family: "Bricolage Grotesque", Inter, sans-serif; font-weight: 800; font-size: clamp(2.4rem, 7vw, 4rem); margin: 0; letter-spacing: -0.03em; }
  .sub { color: var(--muted); max-width: 52ch; margin: 8px 0 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .panel { border: 2px solid var(--ink); border-radius: 6px; min-height: 340px; display: flex; flex-direction: column; background: #fff; overflow: hidden; }
  .drop { flex: 1; display: grid; place-items: center; text-align: center; padding: 20px; cursor: pointer; }
  .drop img { max-width: 100%; max-height: 300px; display: none; }
  .drop p { margin: 0; color: var(--muted); }
  .bar { display: flex; gap: 10px; padding: 12px; border-top: 2px solid var(--ink); }
  button, .btn { font: 600 1rem Inter, sans-serif; padding: 12px 18px; border: 2px solid var(--ink); background: var(--ink); color: #fff; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible, .drop:focus-visible { outline: 3px solid var(--dry); outline-offset: 2px; }
  .result { padding: 28px; flex: 1; display: flex; flex-direction: column; justify-content: center; transition: background .3s; }
  .result h2 { font-family: "Bricolage Grotesque", Inter, sans-serif; font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 8px; letter-spacing: -0.02em; }
  .result p { margin: 0 0 6px; }
  .result.on { color: #fff; }
  .result.Wet { background: var(--wet); } .result.Dry { background: var(--dry); }
  .result.Recyclable { background: var(--recyclable); color: var(--ink); } .result.Hazardous { background: var(--hazardous); }
  .result .conf { opacity: .85; font-size: .95rem; }
  .result.on .hint { color: inherit; }
  .hint { color: var(--muted); }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main>
  <h1>JunkSnap</h1>
  <p class="sub">Take a photo of any waste item. JunkSnap tells you which bin it goes in.</p>

  <div class="grid">
    <section class="panel" aria-label="Waste photo">
      <label class="drop" tabindex="0" for="file">
        <img id="preview" alt="Your waste item">
        <p id="dropText">Tap to take or choose a photo</p>
      </label>
      <input id="file" type="file" accept="image/*" capture="environment">
      <div class="bar">
        <button id="go" disabled>Find the bin</button>
      </div>
    </section>

    <section class="panel result" id="result" aria-live="polite">
      <h2 id="binName">No result yet</h2>
      <p id="binTip" class="hint">Add a photo, then press "Find the bin".</p>
      <p id="binConf" class="conf"></p>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
  // 1. Paste your Teachable Machine model link here (must end with a slash).
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/qMVf8U4TW/";

  // 2. Your class names in Teachable Machine must be: Wet, Dry, Recyclable, Hazardous
  const TIPS = {
    Wet: "Food scraps, peels, leaves. Put it in the green bin.",
    Dry: "Paper, cardboard, dry packaging. Put it in the blue bin.",
    Recyclable: "Clean plastic, glass, metal, cans. Rinse and put it in the recycling bin.",
    Hazardous: "Batteries, bulbs, chemicals, medicines. Hand it to a hazardous waste collection point."
  };

  const file = document.getElementById("file");
  const preview = document.getElementById("preview");
  const dropText = document.getElementById("dropText");
  const go = document.getElementById("go");
  const result = document.getElementById("result");
  const binName = document.getElementById("binName");
  const binTip = document.getElementById("binTip");
  const binConf = document.getElementById("binConf");
  let model = null;

  file.addEventListener("change", () => {
    const f = file.files[0];
    if (!f) return;
    preview.src = URL.createObjectURL(f);
    preview.style.display = "block";
    dropText.style.display = "none";
    go.disabled = false;
  });

  go.addEventListener("click", async () => {
    go.disabled = true;
    go.textContent = "Checking...";
    try {
      if (!model) model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      const preds = await model.predict(preview);
      preds.sort((a, b) => b.probability - a.probability);
      const best = preds[0];
     if (best.probability < 0.6) {
  result.className = "panel result";
  binName.textContent = "Not sure";
  binTip.textContent = "Try a clearer photo with one item in the frame.";
  binConf.textContent = "Best guess: " + best.className + " (" + Math.round(best.probability * 100) + "%)";
} else {
  show(best.className, best.probability);
}
    } catch (e) {
      binName.textContent = "Could not load the model";
      binTip.textContent = "Check that MODEL_URL is your Teachable Machine link and ends with a slash.";
      console.error(e);
    }
    go.textContent = "Find the bin";
    go.disabled = false;
  });

 function show(name, prob) {
  const key = ["Wet", "Dry", "Recyclable", "Hazardous"]
    .find(k => k.toLowerCase() === name.trim().toLowerCase());
  result.className = "panel result" + (key ? " on " + key : "");
  binName.textContent = (key || name) + " waste";
  binTip.textContent = TIPS[key] || "";
  binConf.textContent = "Confidence: " + Math.round(prob * 100) + "%";
}
</script>
</body>
</html>
